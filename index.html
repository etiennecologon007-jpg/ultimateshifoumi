<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifoumi</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer> </script>
    <script src="https://kit.fontawesome.com/c6674749ac.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Shifoumi</h1>
    </header>

    <main>
        <button class="bouton" type="button" data-choix="pierre"><i class="fa-regular fa-hand-back-fist fa-2xl"></i></button>
        <button class="bouton" type="button" data-choix="feuille"><i class="fa-regular fa-hand fa-2xl"></i></button>
        <button class="bouton" type="button" data-choix="ciseau"><i class="fa-regular fa-hand-scissors fa-2xl"></i></button>
        
    </main>
    <section>
        <div id="coupsbox">
            <div class="coups">
                <span>Joueur</span>
            <span id="coupjoueur"><i class="fa-solid fa-x"></i>  </span>
            </div>
            <div class="coups">
                <span>IA</span>
                <span id="coupia"><i class="fa-solid fa-x"></i>  </span>
            </div>
            
        </div>
        <span id="result">Résultat</span>
        <ul>
            <li>Victoire: <span id="victoire">  </span></li>
            <li>Défaite: <span id="defaite">  </span></li>
            <li>Egalité: <span id="egalite">  </span></li>
        </ul>
    </section>
    
</body>
</html>
